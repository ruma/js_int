[package]
name = "js_int"
description = "JavaScript-interoperable integer types"
version = "0.2.2"
edition = "2018"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ruma/js_int"
keywords = ["integer", "no_std"]
categories = ["no-std"]
rust-version = "1.60.0"

[dependencies.serde_core]
version = "1.0.220"
optional = true
default-features = false

[features]
default = ["std"]
"rust_1.81" = []
std = []
serde = ["dep:serde_core"]
